services:
  postgres:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  batch:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["batch"]
    command: python -m app.jobs.collect

  scheduler:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["scheduler"]
    command: sh -c 'while true; do python -m app.jobs.collect; sleep "$${COLLECTION_INTERVAL_MINUTES:-30}"m; done'
    restart: unless-stopped

volumes:
  postgres_data:
