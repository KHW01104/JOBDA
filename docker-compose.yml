services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobda
      POSTGRES_USER: jobda
      POSTGRES_PASSWORD: jobda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobda -d jobda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jobda:jobda@postgres:5432/jobda
      JWT_SECRET: local-development-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5174}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./alembic:/alembic
      - ./alembic.ini:/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  batch:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jobda:jobda@postgres:5432/jobda
      NAVER_IMAP_USERNAME: ${NAVER_IMAP_USERNAME:-}
      NAVER_IMAP_APP_PASSWORD: ${NAVER_IMAP_APP_PASSWORD:-}
      NAVER_IMAP_MAILBOX: ${NAVER_IMAP_MAILBOX:-INBOX}
      NAVER_IMAP_ALLOWED_SENDERS: ${NAVER_IMAP_ALLOWED_SENDERS:-saramin.co.kr}
      NAVER_IMAP_MAX_MESSAGES: ${NAVER_IMAP_MAX_MESSAGES:-100}
      ALIO_API_KEY: ${ALIO_API_KEY:-}
      ALIO_API_URL: ${ALIO_API_URL:-https://opendata.alio.go.kr/new/v1/recruit/list.do}
      ALIO_API_DETAIL_URL: ${ALIO_API_DETAIL_URL:-https://opendata.alio.go.kr/new/v1/recruit/detail.do}
      ALIO_API_PAGE_SIZE: ${ALIO_API_PAGE_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["batch"]
    command: python -m app.jobs.collect

  scheduler:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jobda:jobda@postgres:5432/jobda
      NAVER_IMAP_USERNAME: ${NAVER_IMAP_USERNAME:-}
      NAVER_IMAP_APP_PASSWORD: ${NAVER_IMAP_APP_PASSWORD:-}
      NAVER_IMAP_MAILBOX: ${NAVER_IMAP_MAILBOX:-INBOX}
      NAVER_IMAP_ALLOWED_SENDERS: ${NAVER_IMAP_ALLOWED_SENDERS:-saramin.co.kr}
      NAVER_IMAP_MAX_MESSAGES: ${NAVER_IMAP_MAX_MESSAGES:-100}
      ALIO_API_KEY: ${ALIO_API_KEY:-}
      ALIO_API_URL: ${ALIO_API_URL:-https://opendata.alio.go.kr/new/v1/recruit/list.do}
      ALIO_API_DETAIL_URL: ${ALIO_API_DETAIL_URL:-https://opendata.alio.go.kr/new/v1/recruit/detail.do}
      ALIO_API_PAGE_SIZE: ${ALIO_API_PAGE_SIZE:-100}
      COLLECTION_INTERVAL_MINUTES: ${COLLECTION_INTERVAL_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["scheduler"]
    command: sh -c 'while true; do python -m app.jobs.collect; sleep "$${COLLECTION_INTERVAL_MINUTES}"m; done'

volumes:
  postgres_data:
